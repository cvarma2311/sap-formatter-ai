[tool.poetry]
name = "sap-formatter-ai"
version = "0.1.0"
description = "AI-Powered XML/CSV Validation Framework"
authors = ["Gemini AI <gemini@google.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
pandas = ">=2.0.0"
pyyaml = ">=6.0"
lxml = ">=5.0.0"
pydantic = ">=2.0.0"
openai = ">=1.0.0"
jinja2 = ">=3.0.0"
openpyxl = ">=3.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
